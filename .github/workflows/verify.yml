name: Verify SEDRA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check repository boundary
        run: python scripts/check_repository.py
      - name: Run regression and loopback integration tests
        run: python scripts/verify.py
      - name: Check browser scripts
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem static -Filter *.js) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

# No secrets, provider inference, physical USB, raw CERT download, OS policy
# change, or automatic deployment is required by this verification workflow.
