name: Verify SEDRA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-sso.txt
      - name: Check repository boundary
        run: python scripts/check_repository.py
      - name: Run regression and loopback integration tests
        run: python scripts/verify.py
      - name: Check browser scripts
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem static -Filter *.js) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($script in Get-ChildItem browser-extension -Filter *.js) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify extension worker isolation and offline queue
        run: node --test tests/browser_extension_worker.cjs
      - name: Verify console navigation and presentation boundaries
        run: node --test tests/console_ui.cjs



  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-sso.txt
      - name: Build native Windows endpoint agent
        shell: pwsh
        run: ./windows-agent/Build-Agent.ps1
      - name: Verify native agent queue, replay and delivery
        run: python scripts/smoke_windows_agent.py
      - name: Verify actual SCM service lifecycle as LocalService
        run: python scripts/smoke_windows_agent.py --service --output artifacts/windows_agent_service_v1.json
      - name: Preserve native agent and executed verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedra-windows-agent
          path: |
            windows-agent/bin/Sedra.Agent.exe
            artifacts/windows_agent_smoke_v1.json
            artifacts/windows_agent_service_v1.json
          if-no-files-found: error

# Native tests install/remove only an isolated SEDRAAgent-Test service.
# No customer service, security-policy change, physical USB or external AI is required.
